name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm --onefile --noconsole --name WordToTxt test.py
      - name: Check executable exists
        shell: pwsh
        run: |
          if (!(Test-Path dist/WordToTxt.exe)) {
            throw 'WordToTxt.exe was not created'
          }
      - name: Verify EXE converts a Word document
        run: python scripts/verify_windows_exe.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WordToTxt-Windows-x64
          path: dist/WordToTxt.exe
          if-no-files-found: error
